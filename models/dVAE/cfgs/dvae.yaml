#   tokens_dims: 256, 
#   decoder_dims: 256, 
#   streamline_patch: true,
#   points_per_streamline: 64,
#   local_neighbours: 16
# }

total_bs : 2
step_per_update : 1
max_epoch : 300

dataloader: hyperlocal_fss
# why hyperlocal fss, we are using tractcloud ka data right? 
consider_metric: CDL1