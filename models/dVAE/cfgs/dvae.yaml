optimizer : {
  type: AdamW,
  kwargs: {
  lr : 0.0005, 
  weight_decay : 0.0005
}}

scheduler: {
  type: CosLR,
  kwargs: {
    epochs: 300,
    initial_epochs : 10,
    warming_up_init_lr: 0.00005
}}

temp: {
  start : 1,
  target: 0.0625,
  ntime: 100000 
}

kldweight: {
  start : 0,
  target: 0.1,
  ntime: 100000
}

dataset : {
  train : { _base_: cfgs/s2LocalFeatLoader.yaml, 
            others: {subset: 'train', npoints: 384}},
  val : { _base_: cfgs/s2LocalFeatLoader.yaml, 
            others: {subset: 'val', npoints: 384}},
  test : { _base_: cfgs/s2LocalFeatLoader.yaml, 
            others: {subset: 'test', npoints: 384}}}
model : {
  NAME: DiscreteVAE, 
  encoder_dims: 256,
  num_tokens: 8192,
  tokens_dims: 256, 
  decoder_dims: 256, 
  group : {
    group_size: 128,
    num_group: 32,
    task: fps_knn,
    fix_main_streamline_index: False,
    main_streamline_idx: 0, # this will fix the position main streamline to be classified
    shuffle_streamline: False, # this will randomly shuffle streamline patches
    shuffle_point_inside_streamline: True
  }
}

